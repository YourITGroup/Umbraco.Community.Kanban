name: Umbraco.Community.Kanban - Release

on:
  push:
    branches: [ main ]

env:
  CLIENT_PROJECT: src/Umbraco.Community.Kanban/Client
  KANBAN_PROJECT: src/Umbraco.Community.Kanban/Umbraco.Community.Kanban.csproj
  CONTENTMENT_PROJECT: src/Umbraco.Community.Kanban.Contentment/Umbraco.Community.Kanban.Contentment.csproj
  SOLUTION: Umbraco.Community.Kanban.slnx
  OUTPUT_PATH: ./build-out/

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    strategy:
      matrix:
        dotnet-version: ['10.x']

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: '${{ env.CLIENT_PROJECT }}/package.json'
        cache: 'npm'
        cache-dependency-path: '${{ env.CLIENT_PROJECT }}/package-lock.json'

    - name: Get Kanban Version
      id: package_version
      uses: KageKirin/get-csproj-version@v1
      with:
        file: ${{ env.KANBAN_PROJECT }}
        regex: ^(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)(?:-(?<prerelease>(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+(?<buildmetadata>[0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$

    - name: Check Version v${{ steps.package_version.outputs.version }} Pre-Release state
      id: check_prerelease
      run: |
        if [[ ${{ steps.package_version.outputs.version }} =~ ^[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
          echo "Pre-Release detected"
          echo "prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "Pre-Release NOT detected"
          echo "prerelease=false" >> $GITHUB_OUTPUT
        fi

    - name: Install Node dependencies
      run: npm ci
      working-directory: ${{ env.CLIENT_PROJECT }}

    - name: Build Client
      run: npm run build
      working-directory: ${{ env.CLIENT_PROJECT }}

    - name: Restore solution
      run: dotnet restore ${{ env.SOLUTION }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

    - name: Pack Umbraco.Community.Kanban
      run: dotnet pack ${{ env.KANBAN_PROJECT }} --no-restore --no-build --configuration Release -o ${{ env.OUTPUT_PATH }}

    - name: Pack Umbraco.Community.Kanban.Contentment
      run: dotnet pack ${{ env.CONTENTMENT_PROJECT }} --no-restore --no-build --configuration Release -o ${{ env.OUTPUT_PATH }}

    - name: NuGet Login (Trusted Publishing)
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: ${{ vars.NUGET_USERNAME }}

    - name: Publish to NuGet
      working-directory: ${{ env.OUTPUT_PATH }}
      run: dotnet nuget push *.nupkg -s https://api.nuget.org/v3/index.json --skip-duplicate --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }}

    - uses: avakar/tag-and-release@v1
      name: Create Release Tag v${{ steps.package_version.outputs.version }}
      id: release
      with:
        tag_name: v${{ steps.package_version.outputs.version }}
        prerelease: ${{ steps.check_prerelease.outputs.prerelease }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release information for v${{ steps.package_version.outputs.version }}
      run: |
        echo Release Id: ${{ steps.release.outputs.id }}
        echo Upload URL: ${{ steps.release.outputs.upload_url }}
        echo Release URL: ${{ steps.release.outputs.html_url }}
